<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light only">
    <title>极速动态二维码传输 (暴力性能版)</title>
    <script src="./qrcode.min.js"></script>
    <script src="./jsQR.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f3f4f6; margin: 0; padding: 15px; color: #1f2937; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h1 { font-size: 20px; text-align: center; margin-bottom: 20px; color: #111827; margin-top:0; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #e5e7eb; }
        .tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; font-weight: bold; color: #6b7280; }
        .tab.active { color: #2563eb; border-bottom: 2px solid #2563eb; margin-bottom: -2px; }
        .panel { display: none; }
        .panel.active { display: block; }
        textarea { width: 100%; height: 160px; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; resize: vertical; font-size: 14px; }
        button { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; font-size: 15px; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        button.stop { background: #dc2626; }
        button.stop:hover { background: #b91c1c; }
        
        /* 二维码展示区：强制白边，抗暗黑模式 */
        #qr-container { display: flex; justify-content: center; align-items: center; margin-top: 15px; min-height: 300px; background: #f9fafb; border-radius: 8px; border: 1px dashed #d1d5db; padding: 10px; }
        #fast-qr-display { 
            background-color: #ffffff !important; 
            padding: 20px !important; 
            border-radius: 8px; 
            display: block; 
            box-sizing: border-box;
            color-scheme: light !important; 
            max-width: 100%;
        }

        #video-container { width: 100%; overflow: hidden; background: black; border-radius: 8px; margin-top: 15px; position: relative; }
        video { width: 100%; height: auto; display: block; }
        .progress-bar { height: 8px; background: #e5e7eb; border-radius: 4px; margin-top: 15px; overflow: hidden; }
        .progress-fill { height: 100%; background: #10b981; width: 0%; transition: width 0.1s; }
        .status { text-align: center; margin-top: 8px; font-size: 14px; font-weight: bold; color: #4b5563; }
        .ctrl-group { margin: 10px 0; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .ctrl-group input { width: 110px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-size: 13px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🚀 极速动态二维码传输 (性能暴走版)</h1>
    <div class="tabs">
        <div class="tab active" onclick="switchTab('send')">电脑极速发送</div>
        <div class="tab" onclick="switchTab('receive')">手机极速接收</div>
    </div>

    <div id="panel-send" class="panel active">
        <textarea id="send-text" placeholder="请在此处粘贴需要传输的长文本..."></textarea>
        <div class="ctrl-group">
            <label>单页字符 (推荐 200，识别最快):</label>
            <input type="number" id="chunk-size" value="200" min="50" max="800">
        </div>
        <div class="ctrl-group">
            <label>闪烁速度 (FPS，最高可达30):</label>
            <input type="number" id="fps" value="15" min="1" max="60">
        </div>
        <button id="btn-send" onclick="toggleSend()">🚀 渲染并开始极限闪烁</button>
        <div id="qr-container">
            <img id="fast-qr-display" src="" style="display:none;" />
        </div>
        <div id="send-status" class="status">未开始</div>
    </div>

    <div id="panel-receive" class="panel">
        <button id="btn-receive" onclick="toggleReceive()">📸 开启极速扫描</button>
        <div id="video-container">
            <video id="video" playsinline></video>
            <canvas id="canvas" style="display:none;"></canvas>
        </div>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        <div id="receive-status" class="status">等待开始...</div>
        <textarea id="receive-text" placeholder="接收完成后，完整文本会直接显示在这里..." readonly style="margin-top:15px; background:#f9fafb; height: 180px;"></textarea>
    </div>
</div>

<div id="hidden-qr-generator" style="display:none;"></div>

<script>
    // --- 防止息屏 API ---
    let wakeLock = null;
    async function keepAwake() {
        try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    }
    function releaseAwake() {
        if (wakeLock !== null) wakeLock.release().then(() => wakeLock = null);
    }

    function switchTab(type) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        if(type === 'send') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('panel-send').classList.add('active');
            stopReceive();
        } else {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('panel-receive').classList.add('active');
            stopSend();
        }
    }

    // ==========================================
    // 发送端：预渲染 + RequestAnimationFrame 引擎
    // ==========================================
    let isSending = false;
    let preRenderedImages = []; // 缓存在内存中的图片 DataURL
    let currentFrameIndex = 0;
    let lastRenderTime = 0;
    let sendAnimationId = null;

    async function toggleSend() {
        if (isSending) {
            stopSend();
        } else {
            await startSend();
        }
    }

    async function startSend() {
        const text = document.getElementById('send-text').value.trim();
        if (!text) { alert('请先粘贴文本！'); return; }

        keepAwake();
        const btn = document.getElementById('btn-send');
        const statusEl = document.getElementById('send-status');
        const displayImg = document.getElementById('fast-qr-display');
        
        btn.textContent = '⏳ 正在预渲染二维码内存...';
        btn.disabled = true;
        statusEl.textContent = "准备数据中，请稍候...";

        // 1. 数据切片 (放弃冗余，采用轻量级 Base64 保证兼容)
        const chunkSize = parseInt(document.getElementById('chunk-size').value) || 200;
        const b64Data = btoa(encodeURIComponent(text));
        const chunks = [];
        for (let i = 0; i < b64Data.length; i += chunkSize) {
            chunks.push(b64Data.substring(i, i + chunkSize));
        }
        const total = chunks.length;

        // 2. 暴力预渲染机制 (将所有二维码提前生成为图片缓存)
        preRenderedImages = [];
        const generatorDiv = document.getElementById('hidden-qr-generator');
        
        // 采用低容错率(L) 让二维码斑点更大，手机扫得更快
        let qrEncoder = new QRCode(generatorDiv, { width: 300, height: 300, correctLevel: QRCode.CorrectLevel.L });

        // 为了不卡死浏览器 UI，我们用 setTimeout 分步渲染
        for (let i = 0; i < total; i++) {
            await new Promise(resolve => {
                setTimeout(() => {
                    generatorDiv.innerHTML = ''; // 清空上一张
                    // 格式： 索引|总数|真实数据
                    qrEncoder = new QRCode(generatorDiv, { width: 300, height: 300, correctLevel: QRCode.CorrectLevel.L });
                    qrEncoder.makeCode(`${i}|${total}|${chunks[i]}`);
                    
                    // 提取 canvas 转为 DataURL 缓存到内存
                    const canvas = generatorDiv.querySelector('canvas');
                    if (canvas) {
                        preRenderedImages.push(canvas.toDataURL("image/png"));
                    }
                    statusEl.textContent = `预渲染进度: ${i + 1} / ${total}`;
                    resolve();
                }, 0);
            });
        }

        // 3. 开启极速闪烁引擎
        isSending = true;
        currentFrameIndex = 0;
        lastRenderTime = performance.now();
        displayImg.style.display = 'block';
        
        btn.textContent = '⏹ 停止闪烁';
        btn.classList.add('stop');
        btn.disabled = false;
        
        const targetFps = parseInt(document.getElementById('fps').value) || 15;
        const frameDuration = 1000 / targetFps;

        function renderLoop(currentTime) {
            if (!isSending) return;
            
            const elapsed = currentTime - lastRenderTime;
            // 控制帧率
            if (elapsed >= frameDuration) {
                lastRenderTime = currentTime - (elapsed % frameDuration);
                
                // 瞬间切换图片 src，DOM 零重排，性能消耗近乎为 0
                displayImg.src = preRenderedImages[currentFrameIndex];
                statusEl.textContent = `极速广播中: 第 ${currentFrameIndex + 1} / ${total} 页 (无延迟)`;
                
                // 顺序循环
                currentFrameIndex = (currentFrameIndex + 1) % total;
            }
            sendAnimationId = requestAnimationFrame(renderLoop);
        }
        sendAnimationId = requestAnimationFrame(renderLoop);
    }

    function stopSend() {
        isSending = false;
        if (sendAnimationId) cancelAnimationFrame(sendAnimationId);
        releaseAwake();
        const btn = document.getElementById('btn-send');
        btn.textContent = '🚀 渲染并开始极限闪烁';
        btn.classList.remove('stop');
        document.getElementById('send-status').textContent = '已停止';
    }

    // ==========================================
    // 接收端：低分辨率极速捕获引擎
    // ==========================================
    let isReceiving = false;
    let videoStream = null;
    let receiveAnimationId = null;
    let receivedChunks = new Set(); // 抛弃复杂对象，用 Set 追求最高效查找
    let payloadData = [];
    let totalChunksCount = 0;
    
    // 核心提速参数：限制手机画布的渲染尺寸，大幅降低 jsQR 压力
    const SCAN_MAX_WIDTH = 400; 

    async function toggleReceive() {
        if (isReceiving) stopReceive();
        else startReceive();
    }

    async function startReceive() {
        const video = document.getElementById('video');
        const btn = document.getElementById('btn-receive');
        
        receivedChunks.clear();
        payloadData = [];
        totalChunksCount = 0;
        document.getElementById('receive-text').value = '';
        document.getElementById('progress-fill').style.width = '0%';
        keepAwake();

        try {
            // 采用背部主摄像头，不需要追求过高分辨率，因为我们会压缩
            videoStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } } 
            });
            video.srcObject = videoStream;
            video.setAttribute("playsinline", true);
            video.play();
            
            isReceiving = true;
            btn.textContent = '⏹ 停止扫描';
            btn.classList.add('stop');
            
            video.onplaying = () => { receiveAnimationId = requestAnimationFrame(scanTick); };
        } catch (err) {
            alert("开启相机失败，请检查权限。");
        }
    }

    function stopReceive() {
        isReceiving = false;
        releaseAwake();
        if (receiveAnimationId) cancelAnimationFrame(receiveAnimationId);
        if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); videoStream = null; }
        
        const btn = document.getElementById('btn-receive');
        btn.textContent = '📸 开启极速扫描';
        btn.classList.remove('stop');
    }

    function scanTick() {
        if (!isReceiving) return;

        const video = document.getElementById('video');
        const canvasElement = document.getElementById('canvas');
        const ctx = canvasElement.getContext('2d', { willReadFrequently: true });

        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            // 提速核心：等比例压缩画布
            const scale = Math.min(1, SCAN_MAX_WIDTH / video.videoWidth);
            canvasElement.width = video.videoWidth * scale;
            canvasElement.height = video.videoHeight * scale;
            
            ctx.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
            try {
                const imageData = ctx.getImageData(0, 0, canvasElement.width, canvasElement.height);
                // 彻底放开扫码频率限制，依靠降分辨率带来的性能冗余全速扫描
                const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
                if (code && code.data) {
                    processQRCodeFast(code.data);
                }
            } catch(e) {}
        }
        receiveAnimationId = requestAnimationFrame(scanTick);
    }

    function processQRCodeFast(rawData) {
        // 格式： 索引|总数|真实数据
        const firstPipe = rawData.indexOf('|');
        const secondPipe = rawData.indexOf('|', firstPipe + 1);
        if (firstPipe === -1 || secondPipe === -1) return;

        const index = parseInt(rawData.substring(0, firstPipe));
        const total = parseInt(rawData.substring(firstPipe + 1, secondPipe));
        const payload = rawData.substring(secondPipe + 1);

        if (isNaN(index) || isNaN(total)) return;
        if (totalChunksCount === 0) totalChunksCount = total;

        if (!receivedChunks.has(index)) {
            receivedChunks.add(index);
            payloadData[index] = payload; // 直接落位数组
            
            const percent = (receivedChunks.size / totalChunksCount) * 100;
            document.getElementById('progress-fill').style.width = percent + '%';
            document.getElementById('receive-status').textContent = `极速接收中: ${receivedChunks.size} / ${totalChunksCount}`;
            
            if (receivedChunks.size === totalChunksCount) {
                finishTransfer();
            }
        }
    }

    function finishTransfer() {
        stopReceive();
        try {
            let fullB64 = payloadData.join('');
            const originalText = decodeURIComponent(escape(atob(fullB64)));
            document.getElementById('receive-text').value = originalText;
            document.getElementById('receive-status').textContent = '🎉 接收完成！';
        } catch (e) {
            document.getElementById('receive-status').textContent = '❌ 数据解析失败';
        }
    }
</script>
</body>
</html>
