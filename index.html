<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light only">
    <title>大文本动态二维码传输 (高配硬件实时版)</title>
    <script src="./qrcode.min.js"></script>
    <script src="./jsQR.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f3f4f6; margin: 0; padding: 15px; color: #1f2937; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h1 { font-size: 20px; text-align: center; margin-bottom: 20px; color: #111827; margin-top:0; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #e5e7eb; }
        .tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; font-weight: bold; color: #6b7280; }
        .tab.active { color: #2563eb; border-bottom: 2px solid #2563eb; margin-bottom: -2px; }
        .panel { display: none; }
        .panel.active { display: block; }
        textarea { width: 100%; height: 160px; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; resize: vertical; font-size: 14px; }
        button { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; font-size: 15px; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        button.stop { background: #dc2626; }
        button.stop:hover { background: #b91c1c; }
        
        /* 终极对抗黑暗模式：绝对死守组件纯白背景与安全静区 */
        #qr-container { display: flex; justify-content: center; align-items: center; margin-top: 15px; min-height: 300px; background: #f9fafb; border-radius: 8px; border: 1px dashed #d1d5db; padding: 10px; }
        #qrcode { 
            background-color: #ffffff !important; 
            padding: 16px !important; 
            border-radius: 8px; 
            display: inline-block; 
            box-sizing: border-box;
            color-scheme: light !important; 
            filter: none !important; 
            forced-color-adjust: none !important; 
        }
        #qrcode img, #qrcode canvas { background-color: #ffffff !important; filter: none !important; }

        #video-container { width: 100%; overflow: hidden; background: black; border-radius: 8px; margin-top: 15px; position: relative; }
        video { width: 100%; height: auto; display: block; }
        .progress-bar { height: 8px; background: #e5e7eb; border-radius: 4px; margin-top: 15px; overflow: hidden; }
        .progress-fill { height: 100%; background: #10b981; width: 0%; transition: width 0.1s; }
        .status { text-align: center; margin-top: 8px; font-size: 14px; font-weight: bold; color: #4b5563; }
        .ctrl-group { margin: 10px 0; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .ctrl-group input, .ctrl-group select { width: 130px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-size: 13px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🚀 动态二维码传输 (高配实时极速版)</h1>
    <div class="tabs">
        <div class="tab active" onclick="switchTab('send')">电脑发送端</div>
        <div class="tab" onclick="switchTab('receive')">手机接收端</div>
    </div>

    <div id="panel-send" class="panel active">
        <textarea id="send-text" placeholder="请在此处粘贴需要传输的长文本..."></textarea>
        
        <div class="ctrl-group">
            <label>二维码容错率:</label>
            <select id="correct-level">
                <option value="1" selected>L级 (7% 极速，适合无遮挡)</option>
                <option value="0">M级 (15% 均衡推荐)</option>
                <option value="3">Q级 (25% 较高可靠)</option>
                <option value="2">H级 (30% 极强，点阵最密)</option>
            </select>
        </div>
        <div class="ctrl-group">
            <label>单页字符 (推荐 200-300):</label>
            <input type="number" id="chunk-size" value="250" min="50" max="800">
        </div>
        <div class="ctrl-group">
            <label>闪烁速度 (FPS):</label>
            <input type="number" id="fps" value="15" min="1" max="60">
        </div>
        <button id="btn-send" onclick="toggleSend()">⚡ 立即生成并循环闪烁</button>
        <div id="qr-container"><div id="qrcode"></div></div>
        <div id="send-status" class="status">未开始</div>
    </div>

    <div id="panel-receive" class="panel">
        <button id="btn-receive" onclick="toggleReceive()">📸 开启极速扫描</button>
        <div id="video-container">
            <video id="video" playsinline></video>
            <canvas id="canvas" style="display:none;"></canvas>
        </div>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        <div id="receive-status" class="status">等待开始...</div>
        <textarea id="receive-text" placeholder="接收完成后，完整文本会直接显示在这里..." readonly style="margin-top:15px; background:#f9fafb; height: 180px;"></textarea>
    </div>
</div>

<script>
    // --- 防止息屏 API ---
    let wakeLock = null;
    async function keepAwake() {
        try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    }
    function releaseAwake() {
        if (wakeLock !== null) wakeLock.release().then(() => wakeLock = null);
    }

    function switchTab(type) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        if(type === 'send') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('panel-send').classList.add('active');
            stopReceive();
        } else {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('panel-receive').classList.add('active');
            stopSend();
        }
    }

    // ==========================================
    // 发送端：暴力实时渲染 (零等待，秒开)
    // ==========================================
    let isSending = false;
    let sendInterval = null;
    let qrEncoder = null;

    function toggleSend() {
        if (isSending) stopSend();
        else startSend();
    }

    function startSend() {
        const text = document.getElementById('send-text').value.trim();
        if (!text) { alert('请先粘贴文本！'); return; }

        keepAwake();
        const btn = document.getElementById('btn-send');
        const statusEl = document.getElementById('send-status');
        
        // 1. 数据切片
        const chunkSize = parseInt(document.getElementById('chunk-size').value) || 250;
        const b64Data = btoa(encodeURIComponent(text));
        const chunks = [];
        for (let i = 0; i < b64Data.length; i += chunkSize) {
            chunks.push(b64Data.substring(i, i + chunkSize));
        }
        const total = chunks.length;

        // 2. 初始化二维码对象 (获取你的容错率挡位)
        document.getElementById('qrcode').innerHTML = '';
        const levelVal = parseInt(document.getElementById('correct-level').value);
        qrEncoder = new QRCode(document.getElementById("qrcode"), { 
            width: 320,  // 放大一点，保证高容错率时像素点不模糊
            height: 320, 
            correctLevel: levelVal 
        });

        // 3. 启动实时高频轮询 (不再预渲染，依靠高配电脑实时计算)
        isSending = true;
        let currentFrameIndex = 0;
        btn.textContent = '⏹ 停止闪烁';
        btn.classList.add('stop');
        
        const fps = parseInt(document.getElementById('fps').value) || 15;
        const frameDuration = 1000 / fps;

        sendInterval = setInterval(() => {
            // 格式： 索引|总数|真实数据
            let payload = `${currentFrameIndex}|${total}|${chunks[currentFrameIndex]}`;
            qrEncoder.clear();
            qrEncoder.makeCode(payload);
            
            statusEl.textContent = `实时极速广播: 第 ${currentFrameIndex + 1} / ${total} 页`;
            currentFrameIndex = (currentFrameIndex + 1) % total;
        }, frameDuration);
    }

    function stopSend() {
        isSending = false;
        if (sendInterval) clearInterval(sendInterval);
        releaseAwake();
        const btn = document.getElementById('btn-send');
        btn.textContent = '⚡ 立即生成并循环闪烁';
        btn.classList.remove('stop');
        document.getElementById('send-status').textContent = '已停止';
    }

    // ==========================================
    // 接收端：原生极速引擎 (无校验负担，纯拼手速)
    // ==========================================
    let isReceiving = false;
    let videoStream = null;
    let receiveAnimationId = null;
    let receivedMap = new Map(); // 使用 Map 追求最高效管理
    let totalChunksCount = 0;
    
    // 提速核心：即使在 M 或 H 容错率下，600px 足以让 jsQR 精准识别，同时极大减轻 CPU 负担
    const SCAN_MAX_WIDTH = 600; 

    async function toggleReceive() {
        if (isReceiving) stopReceive();
        else startReceive();
    }

    async function startReceive() {
        const video = document.getElementById('video');
        const btn = document.getElementById('btn-receive');
        
        receivedMap.clear();
        totalChunksCount = 0;
        document.getElementById('receive-text').value = '';
        document.getElementById('progress-fill').style.width = '0%';
        keepAwake();

        try {
            videoStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 1080 }, height: { ideal: 720 } } 
            });
            video.srcObject = videoStream;
            video.setAttribute("playsinline", true);
            video.play();
            
            isReceiving = true;
            btn.textContent = '⏹ 停止扫描';
            btn.classList.add('stop');
            
            video.onplaying = () => { receiveAnimationId = requestAnimationFrame(scanTick); };
        } catch (err) {
            alert("开启相机失败，请检查权限。");
        }
    }

    function stopReceive() {
        isReceiving = false;
        releaseAwake();
        if (receiveAnimationId) cancelAnimationFrame(receiveAnimationId);
        if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); videoStream = null; }
        
        const btn = document.getElementById('btn-receive');
        btn.textContent = '📸 开启极速扫描';
        btn.classList.remove('stop');
    }

    function scanTick() {
        if (!isReceiving) return;

        const video = document.getElementById('video');
        const canvasElement = document.getElementById('canvas');
        const ctx = canvasElement.getContext('2d', { willReadFrequently: true });

        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            // 画布按比例压缩到 600px 宽度
            const scale = Math.min(1, SCAN_MAX_WIDTH / video.videoWidth);
            canvasElement.width = video.videoWidth * scale;
            canvasElement.height = video.videoHeight * scale;
            
            ctx.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
            try {
                const imageData = ctx.getImageData(0, 0, canvasElement.width, canvasElement.height);
                // 关闭强制翻转可节省一倍的运算量 (我们已经保证了白底黑码)
                const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
                if (code && code.data) {
                    processQRCodeFast(code.data);
                }
            } catch(e) {}
        }
        // iPhone 性能足够，我们不再人为锁定频率，直接放开让 RAF 满载奔跑
        receiveAnimationId = requestAnimationFrame(scanTick);
    }

    function processQRCodeFast(rawData) {
        const firstPipe = rawData.indexOf('|');
        const secondPipe = rawData.indexOf('|', firstPipe + 1);
        if (firstPipe === -1 || secondPipe === -1) return;

        const index = parseInt(rawData.substring(0, firstPipe));
        const total = parseInt(rawData.substring(firstPipe + 1, secondPipe));
        const payload = rawData.substring(secondPipe + 1);

        if (isNaN(index) || isNaN(total)) return;
        if (totalChunksCount === 0) totalChunksCount = total;

        if (!receivedMap.has(index)) {
            receivedMap.set(index, payload);
            
            const percent = (receivedMap.size / totalChunksCount) * 100;
            document.getElementById('progress-fill').style.width = percent + '%';
            document.getElementById('receive-status').textContent = `全速接收: ${receivedMap.size} / ${totalChunksCount}`;
            
            if (receivedMap.size === totalChunksCount) {
                finishTransfer();
            }
        }
    }

    function finishTransfer() {
        stopReceive();
        try {
            // 将 Map 转回有序数组并合并
            let fullB64 = '';
            for (let i = 0; i < totalChunksCount; i++) {
                fullB64 += receivedMap.get(i);
            }
            const originalText = decodeURIComponent(escape(atob(fullB64)));
            document.getElementById('receive-text').value = originalText;
            document.getElementById('receive-status').textContent = '🎉 接收完成！';
        } catch (e) {
            document.getElementById('receive-status').textContent = '❌ 数据解析失败';
        }
    }
</script>
</body>
</html>
